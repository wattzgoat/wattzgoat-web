{% extends "mail_base.html" %}
{% block title %}{{ email['subject'] }} — Mail{% endblock %}
{% block content %}
<a href="{{ url_for('mail.inbox') }}" class="text-sm text-gray-500 hover:text-gray-900">&larr; Back to inbox</a>
<div class="bg-white border rounded-lg p-6 mt-3">
  <h1 class="text-xl font-semibold mb-1">{{ email['subject'] }}</h1>
  <p class="text-sm text-gray-500 mb-6">{{ email['sender_name'] }} &lt;{{ email['sender_email'] }}&gt; · {{ email['created_at'] }}</p>
  <div>
    {{ email['body_html']|safe }}
  </div>
</div>
{% endblock %}
