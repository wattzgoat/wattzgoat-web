{% extends "base.html" %}
{% block title %}Solar Leaderboard — WattzGOAT{% endblock %}
{% block content %}
{% import "_ui.html" as ui %}
<div class="mx-auto mt-4 max-w-md rounded-2xl bg-white p-6 shadow-card ring-1 ring-black/5">
  <span class="mb-4 inline-flex h-11 w-11 items-center justify-center rounded-xl bg-accent/20 text-ink">{{ ui.icon('sun', 22) }}</span>
  <h1 class="mb-1 text-xl font-semibold tracking-tight">Top solar exporters</h1>
  <p class="mb-6 text-sm text-gray-500">See how your community's solar exports stack up this month.</p>
  <ol id="board" class="divide-y divide-gray-100 text-sm"></ol>
</div>
<script>
fetch('/api/leaderboard').then(r => r.json()).then(data => {
  const board = document.getElementById('board');
  data.forEach((row, i) => {
    const li = document.createElement('li');
    li.className = 'py-2 flex justify-between';
    li.innerHTML = '<span>#' + (i + 1) + ' ' + row.name + '</span><span>' + row.total_exported_kwh.toFixed(1) + ' kWh</span>';
    board.appendChild(li);
  });
});
</script>
{% endblock %}
