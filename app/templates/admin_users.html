{% extends "base.html" %}
{% block title %}Users — WattzGOAT Admin{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Users</h1>
<div class="bg-white rounded-lg shadow-sm overflow-x-auto">
<table class="w-full text-sm">
<thead class="bg-gray-50 text-left text-gray-500">
<tr><th class="px-4 py-2">Name</th><th class="px-4 py-2">Email</th><th class="px-4 py-2">Role</th><th class="px-4 py-2">Created</th></tr>
</thead>
<tbody class="divide-y">
{% for u in users %}
<tr>
<td class="px-4 py-2 whitespace-nowrap">{{ u['name'] }}</td>
<td class="px-4 py-2 whitespace-nowrap">{{ u['email'] }}</td>
<td class="px-4 py-2">
  <span class="text-xs px-2 py-0.5 rounded-full {{ 'bg-indigo-100 text-indigo-700' if u['role']=='admin' else 'bg-gray-100 text-gray-700' }}">{{ u['role'] }}</span>
</td>
<td class="px-4 py-2 whitespace-nowrap text-gray-500">{{ u['created_at'] }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
