{% extends "base.html" %}
{% block title %}Password updated — WattzGOAT{% endblock %}
{% block content %}
{% import "_ui.html" as ui %}
<div class="mx-auto mt-8 w-full max-w-sm animate-fade-up motion-reduce:animate-none rounded-2xl bg-white p-8 text-center shadow-card ring-1 ring-black/5">
  <span class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-green-700">{{ ui.icon('check-circle', 26) }}</span>
  <h1 class="mb-2 text-xl font-bold tracking-tight">Password updated</h1>
  <p class="mb-5 text-sm text-gray-600">You can now log in with the new password.</p>
  <a href="{{ url_for('auth.login') }}" class="{{ ui.btn_class('primary') }}">Continue to log in {{ ui.icon('arrow-right', 16) }}</a>
</div>
{% endblock %}
