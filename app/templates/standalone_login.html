{% extends "standalone_base.html" %}
{% block title %}Instructor sign-in — WattzGOAT{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg p-8 shadow-sm">
  <h1 class="text-sm uppercase tracking-wide text-gray-500 mb-6">Participants console</h1>
  {% if error %}
  <p class="text-red-600 text-sm mb-3">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('standalone.login') }}" class="space-y-4">
    <div>
      <label class="block text-sm mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus class="w-full border rounded px-3 py-2">
    </div>
    <button class="w-full bg-[#14181C] text-white rounded py-2 font-medium">Sign in</button>
  </form>
</div>
{% endblock %}
