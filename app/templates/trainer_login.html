<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor login — WattzGOAT</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="bg-[#F2EFE9] text-[#14181C] min-h-screen flex items-center justify-center" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<div class="bg-white rounded-lg shadow-sm p-8 w-full max-w-sm">
  <div class="flex items-center gap-2 mb-1">
    <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M60 4 L20 56 L42 56 L34 96 L80 40 L52 40 Z" fill="#F4B41A"/>
    </svg>
    <span class="font-semibold text-lg">Wattz<span class="text-[#F4B41A] font-bold">GOAT</span></span>
  </div>
  <h1 class="text-sm uppercase tracking-wide text-gray-500 mb-6">Instructor dashboard</h1>

  {% if error %}
  <p class="text-sm text-red-600 bg-red-50 rounded px-3 py-2 mb-4">{{ error }}</p>
  {% endif %}

  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
      <input type="password" id="password" name="password" required
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full bg-[#14181C] text-white rounded py-2 text-sm font-medium">
      Log in
    </button>
  </form>

  <p class="text-xs text-gray-400 mt-6">
    This is a separate, dedicated instructor login — not the participant app's account system.
  </p>
</div>
</body>
</html>
