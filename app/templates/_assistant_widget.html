<!-- Simulated AI assistant widget -- rule-based, NOT a real model (see
     app/assistant.py). Visible on every authenticated page, customer and
     admin alike; capability set differs by role, handled server-side. -->
<div id="wg-assistant-root">
  <button id="wg-assistant-toggle" type="button" aria-label="Chat with WattzBot"
    style="position:fixed;bottom:20px;right:20px;z-index:9999;background:#F4B41A;color:#14181C;
           border:none;border-radius:9999px;width:56px;height:56px;font-size:22px;cursor:pointer;
           box-shadow:0 2px 8px rgba(0,0,0,.25);">💬</button>
  <div id="wg-assistant-panel"
    style="display:none;flex-direction:column;position:fixed;bottom:86px;right:20px;z-index:9999;
           width:420px;height:600px;max-height:75vh;background:#fff;border-radius:12px;
           box-shadow:0 4px 20px rgba(0,0,0,.25);overflow:hidden;font-family:'Space Grotesk',sans-serif;">
    <div style="background:#14181C;color:#fff;padding:12px 16px;">
      <div style="font-size:15px;font-weight:600;">{{ 'WattzBot Ops' if g.user['role'] == 'admin' else 'WattzBot' }}</div>
    </div>
    <div id="wg-assistant-messages" style="flex:1;overflow-y:auto;padding:12px;font-size:14px;background:#F9FAFB;"></div>
    <form id="wg-assistant-form" style="display:flex;border-top:1px solid #E5E7EB;">
      <input id="wg-assistant-input" type="text" placeholder="Ask a question, or type 'help'…" autocomplete="off"
        style="flex:1;border:none;padding:12px;font-size:14px;outline:none;">
      <button type="submit" style="border:none;background:#14181C;color:#fff;padding:0 18px;cursor:pointer;">Send</button>
    </form>
  </div>
</div>
<script>
(function () {
  var toggle = document.getElementById('wg-assistant-toggle');
  var panel = document.getElementById('wg-assistant-panel');
  var messages = document.getElementById('wg-assistant-messages');
  var form = document.getElementById('wg-assistant-form');
  var input = document.getElementById('wg-assistant-input');

  toggle.addEventListener('click', function () {
    var isOpen = panel.style.display === 'flex';
    panel.style.display = isOpen ? 'none' : 'flex';
    if (!isOpen) input.focus();
  });

  function addMessage(text, who) {
    var row = document.createElement('div');
    row.style.margin = '8px 0';
    row.style.textAlign = who === 'me' ? 'right' : 'left';
    var bubble = document.createElement('span');
    bubble.style.display = 'inline-block';
    bubble.style.padding = '8px 12px';
    bubble.style.borderRadius = '10px';
    bubble.style.maxWidth = '85%';
    bubble.style.background = who === 'me' ? '#F4B41A' : '#E5E7EB';
    if (who === 'me') {
      // The user's own message is always rendered safely.
      bubble.textContent = text;
    } else if ({{ 'true' if is_hardened('ASSISTANT_OUTPUT_XSS') else 'false' }}) {
      // Phase 6: ASSISTANT_OUTPUT_XSS hardened -- bot replies rendered
      // the same safe way as the user's own messages. This is the
      // actual fix (matches the remediation note word for word: "never
      // render assistant output with innerHTML"), not a server-side
      // stub -- a working marker in the echoed text is now just inert
      // text on the page either way.
      bubble.textContent = text;
    } else {
      // NOTE: bot replies are rendered with innerHTML, not textContent.
      // The simulated bot's fallback echoes unrecognized input back
      // verbatim -- this line is the actual mechanism behind the
      // insecure-output-handling bonus flag, not an accidental bug.
      bubble.innerHTML = text;
    }
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  // Simulated "thinking" delay with rotating status text, so the bot
  // reads more like a real agent working through a request than an
  // instant lookup. Purely cosmetic -- no bearing on any flag.
  var STATUS_STEPS = {{ ('["Checking meter records\u2026", "Looking up account details\u2026", "Preparing a response\u2026"]' if g.user['role'] == 'admin' else '["Checking your account\u2026", "Looking that up\u2026", "Preparing a response\u2026"]') | safe }};

  function showThinking() {
    var row = addMessage(STATUS_STEPS[0], 'bot');
    var bubble = row.querySelector('span');
    var step = 0;
    var interval = setInterval(function () {
      step = (step + 1) % STATUS_STEPS.length;
      bubble.textContent = STATUS_STEPS[step];
      messages.scrollTop = messages.scrollHeight;
    }, 500);
    return { row: row, stop: function () { clearInterval(interval); } };
  }

  addMessage('Hi, I\'m {{ "WattzBot Ops" if g.user["role"] == "admin" else "WattzBot" }}. How can I help? Type \'help\' to see what I can do.', 'bot');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addMessage(text, 'me');
    input.value = '';

    var thinking = showThinking();
    var started = Date.now();
    var MIN_DELAY_MS = 900;

    fetch('/assistant/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var elapsed = Date.now() - started;
        var wait = Math.max(0, MIN_DELAY_MS - elapsed);
        setTimeout(function () {
          thinking.stop();
          thinking.row.remove();
          addMessage(data.reply || '(no response)', 'bot');
        }, wait);
      })
      .catch(function () {
        thinking.stop();
        thinking.row.remove();
        addMessage('Something went wrong reaching the assistant.', 'bot');
      });
  });
})();
</script>
