<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Participants — WattzGOAT{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="bg-canvas text-ink min-h-screen font-sans antialiased">
<header class="sticky top-0 z-30 flex flex-wrap items-center gap-x-3 gap-y-2 bg-ink/95 px-6 py-3 text-white shadow-lift backdrop-blur">
  <span class="flex items-center gap-3">
    <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M60 4 L20 56 L42 56 L34 96 L80 40 L52 40 Z" fill="#F4B41A"/>
    </svg>
    <span class="font-semibold text-lg">Wattz<span class="text-[#F4B41A] font-bold">GOAT</span></span>
  </span>
  <span class="rounded-full bg-accent px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-ink">Instructor</span>
  {% block nav %}{% endblock %}
</header>
<main class="mx-auto max-w-5xl px-6 py-10">
{% block content %}{% endblock %}
</main>
{% include "_instructor_ui.html" %}
</body>
</html>
